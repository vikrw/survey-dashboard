<div class="min-h-screen bg-background pt-24 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header -->
    <div class="bg-surface/50 backdrop-blur-xl border border-white/10 rounded-2xl p-6 md:p-8 mb-8 shadow-xl relative overflow-hidden">
      <!-- Decorative Gradient -->
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-blue-400 to-primary"></div>
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex-1">
          <input 
            type="text" 
            [ngModel]="store.title()"
            (ngModelChange)="onTitleChange($event)"
            placeholder="Survey Title"
            class="w-full bg-transparent border-b border-transparent hover:border-white/10 focus:border-primary text-3xl font-bold text-white focus:outline-none transition-colors py-2 px-1"
          >
          <div class="mt-2 text-sm text-text-muted px-1 flex gap-4">
            <span class="flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
              </svg>
              {{ store.totalQuestions() }} Questions
            </span>
            <span class="flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
              {{ store.validQuestions() }} Valid
            </span>
          </div>
        </div>

        <button 
          (click)="saveSurvey()"
          [disabled]="store.isSaving() || store.totalQuestions() === 0"
          class="flex items-center gap-2 px-6 py-3 rounded-lg bg-white text-background font-semibold hover:bg-gray-100 disabled:opacity-50 transition-colors shadow-lg shadow-white/10"
        >
          @if (store.isSaving()) {
            <svg class="animate-spin h-5 w-5 text-background" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
            Save Survey
          }
        </button>
      </div>
    </div>

    <!-- Questions List -->
    <div class="space-y-6 mb-8">
      @for (question of store.questions(); track question.id) {
        <app-question-form 
          [question]="question"
          (questionUpdate)="onQuestionUpdate($event)"
          (questionDelete)="onQuestionDelete($event)">
        </app-question-form>
      } @empty {
        <div class="text-center py-16 px-4 bg-surface/30 border border-dashed border-white/20 rounded-2xl">
          <div class="bg-primary/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
          <h3 class="text-xl font-medium text-white mb-2">No Questions Yet</h3>
          <p class="text-text-muted mb-6 max-w-md mx-auto">Start building your survey by adding your first question below.</p>
        </div>
      }
    </div>

    <!-- Add Question Button -->
    <button 
      (click)="addQuestion()"
      class="w-full py-4 border-2 border-dashed border-primary/50 text-primary hover:bg-primary/10 rounded-xl flex items-center justify-center gap-2 font-medium transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      Add New Question
    </button>

  </div>
</div>
