<div class="min-h-screen flex items-center justify-center bg-background relative overflow-hidden">
  
  <!-- Premium Background Effects -->
  <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/20 blur-[120px]"></div>
  <div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary-hover/20 blur-[100px]"></div>

  <div class="relative z-10 w-full max-w-md p-8 rounded-2xl bg-surface/50 backdrop-blur-xl border border-white/10 shadow-2xl">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-blue-400">
        Reset Password
      </h1>
      <p class="text-text-muted mt-2">Enter your email to receive a password reset link</p>
    </div>

    <form (submit)="onSubmit($event)" class="space-y-6">
      
      @if (errorMessage()) {
        <div class="p-4 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="p-4 rounded-lg bg-green-500/10 border border-green-500/20 text-green-400 text-sm">
          {{ successMessage() }}
        </div>
      }

      <div class="space-y-2">
        <label for="reset-email" class="block text-sm font-medium text-text-main">Email Address</label>
        <input 
          id="reset-email" 
          type="email" 
          [formField]="resetForm.email"
          class="w-full px-4 py-3 rounded-lg bg-background/50 border border-white/10 text-white placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
          placeholder="you@example.com"
        >
        @if (resetForm.email().touched()) {
          @for (error of resetForm.email().errors(); track error) {
            <span class="text-red-400 text-xs block mt-1">{{ error.message }}</span>
          }
        }
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full py-3 px-4 flex justify-center items-center gap-2 rounded-lg bg-gradient-to-r from-primary to-primary-hover text-white font-medium hover:shadow-[0_0_20px_rgba(79,70,229,0.4)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none transition-all duration-300"
      >
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sending link...
        } @else {
          Send Reset Link
        }
      </button>

    </form>

    <p class="text-center text-text-muted text-sm mt-6">
      Back to 
      <a routerLink="/login" class="text-primary hover:text-primary-hover font-medium transition-colors">Sign in</a>
    </p>
  </div>
</div>
