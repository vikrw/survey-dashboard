<div class="fixed top-20 right-4 z-[100] flex flex-col gap-2 pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div 
      class="pointer-events-auto w-80 max-w-[90vw] p-4 rounded-xl shadow-2xl flex items-start gap-3 backdrop-blur-xl border border-white/10 animate-slide-up transition-all"
      [class.bg-green-500]="toast.type === 'success'"
      [class.bg-red-500]="toast.type === 'error'"
      [class.bg-blue-500]="toast.type === 'info'"
      [style.backgroundColor]="toast.type === 'success' ? 'rgba(34, 197, 94, 0.15)' : toast.type === 'error' ? 'rgba(239, 68, 68, 0.15)' : 'rgba(59, 130, 246, 0.15)'"
    >
      <div class="flex-shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
        } @else if (toast.type === 'error') {
          <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
          </svg>
        } @else {
          <svg class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
          </svg>
        }
      </div>
      <div 
        class="flex-1 text-sm font-medium pt-0.5"
        [class.text-green-400]="toast.type === 'success'"
        [class.text-red-400]="toast.type === 'error'"
        [class.text-blue-400]="toast.type === 'info'"
      >
        {{ toast.message }}
      </div>
      <button (click)="toastService.remove(toast.id)" class="text-white/40 hover:text-white transition-colors pt-0.5">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  }
</div>
